# Запуск: cp .env.example .env && docker compose up --build
# Backend -> http://localhost:8000 (Swagger: /docs), Frontend -> http://localhost:3000
# Переменные ${...} подставляются из .env в корне (если он есть), иначе берутся значения по умолчанию.

services:
  backend:
    build:
      context: ./backend
    env_file:
      - path: .env
        required: false
    volumes:
      - ./data:/app/data:ro
      - backend_runs:/app/runtime
    environment:
      DATA_DIR: /app/data
      RUNTIME_DIR: /app/runtime
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      LLM_MODE: ${LLM_MODE:-mock}
      # Дефолт держать таким же, как в backend/app/config.py.
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6-luna}
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-ОргДифф}
    environment:
      # Адрес API для серверного рендеринга внутри docker-сети (браузер ходит по NEXT_PUBLIC_API_URL).
      API_URL_INTERNAL: http://backend:8000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-ОргДифф}
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 15s
    restart: unless-stopped

volumes:
  backend_runs:
