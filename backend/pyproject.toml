[project]
name = "orgdiff-backend"
version = "0.1.0"
description = "FastAPI backend of the hackathon boilerplate (no domain logic)"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "openai>=1.100",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "numpy>=2",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

# Проект «виртуальный»: uv ставит зависимости, но не собирает сам пакет `app`.
# Импорт `app.*` работает из каталога backend/ (см. pythonpath у pytest и WORKDIR в Dockerfile).
[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
